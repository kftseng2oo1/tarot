<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a1a68"/><stop offset=".55" stop-color="#1a0b33"/><stop offset="1" stop-color="#0a0612"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc94"/><stop offset=".5" stop-color="#c9a84c"/><stop offset="1" stop-color="#8f6b22"/>
    </linearGradient>
    <linearGradient id="faceG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1550"/><stop offset="1" stop-color="#120826"/>
    </linearGradient>
    <linearGradient id="backG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24123f"/><stop offset="1" stop-color="#0e0720"/>
    </linearGradient>
    <pattern id="lattice" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="none"/>
      <path d="M0 0H18M0 0V18" stroke="#c9a84c" stroke-opacity=".32" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9a84c" stop-opacity=".35"/><stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="70" cy="90" r="2.2" fill="#fff" opacity="0.6"/><circle cx="440" cy="70" r="1.8" fill="#fff" opacity="0.5"/><circle cx="460" cy="190" r="1.4" fill="#fff" opacity="0.4"/><circle cx="52" cy="250" r="1.6" fill="#fff" opacity="0.4"/><circle cx="88" cy="440" r="1.8" fill="#fff" opacity="0.45"/><circle cx="430" cy="430" r="2" fill="#fff" opacity="0.5"/><circle cx="120" cy="160" r="1.2" fill="#fff" opacity="0.35"/><circle cx="400" cy="320" r="1.3" fill="#fff" opacity="0.35"/>
  <g transform="translate(256 262) scale(1.0) translate(-256 -262)">
    <g transform="rotate(-17 256 410)">
      <rect x="170" y="112" width="172" height="290" rx="16" fill="url(#backG)" stroke="#c9a84c" stroke-opacity=".9" stroke-width="4"/>
      <rect x="184" y="126" width="144" height="262" rx="9" fill="url(#lattice)" stroke="#c9a84c" stroke-opacity=".3" stroke-width="2"/>
    </g>
    <g transform="rotate(17 256 410)">
      <rect x="170" y="112" width="172" height="290" rx="16" fill="url(#backG)" stroke="#c9a84c" stroke-opacity=".9" stroke-width="4"/>
      <rect x="184" y="126" width="144" height="262" rx="9" fill="url(#lattice)" stroke="#c9a84c" stroke-opacity=".3" stroke-width="2"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="164" y="98" width="184" height="312" rx="18" fill="url(#faceG)"/>
      <rect x="164" y="98" width="184" height="312" rx="18" fill="none" stroke="url(#gold)" stroke-width="6"/>
      <rect x="180" y="114" width="152" height="280" rx="10" fill="none" stroke="#c9a84c" stroke-opacity=".55" stroke-width="2.5"/>
    </g>
    <!-- 上方小星 -->
    <path d="M256 134 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#e8d18a"/>
    <!-- 月亮光暈 -->
    <circle cx="256" cy="252" r="70" fill="url(#halo)"/>
    <!-- 新月 -->
    <path d="M276 196 A60 60 0 1 0 276 308 A48 48 0 1 1 276 196 Z" fill="url(#gold)"/>
