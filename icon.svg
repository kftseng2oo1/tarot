    <circle cx="300" cy="216" r="3.2" fill="#fff6d8" opacity=".85"/>
    <circle cx="232" cy="300" r="2.4" fill="#fff6d8" opacity=".6"/>
    <!-- 底部羅馬數字 XVIII（月亮牌）-->
    <line x1="206" y1="346" x2="306" y2="346" stroke="#c9a84c" stroke-opacity=".45" stroke-width="2"/>
    <text x="256" y="378" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="25" letter-spacing="5" fill="#e8d18a">XVIII</text>
    </g>
</svg>